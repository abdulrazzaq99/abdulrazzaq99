name: Contribution grid

# Renders the contribution calendar as an animated SVG in the portfolio's
# emerald palette and publishes it to the `output` branch for the README.

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-grid-light.svg?color_snake=#006940&color_dots=#EBEDF0,#B7E4CC,#5CC794,#00A25A,#006940
            dist/contribution-grid-dark.svg?color_snake=#00DB79&color_dots=#161B22,#0B3D26,#00693F,#00A25A,#00DB79

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
